name: build-debug
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['LICENSE', '*.md']
jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore
      - run: ./gradlew :gkd-app:assembleGkdDebug --no-daemon
      - name: 创建发版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          files: gkd-app/build/outputs/apk/gkd/debug/*.apk

